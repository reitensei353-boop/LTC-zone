<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="蛊真人">
<meta name="theme-color" content="#12141c">
<meta name="description" content="蛊真人·青茅山：像素回合制 RPG。春秋蝉逆转五百年，方源重回青茅山。">
<title>蛊真人·青茅山</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="atlas.png" as="image">
<link rel="preload" href="title_banner.png" as="image">
<style>
  :root {
    --bg: #12141c;
    --elev: #1c2030;
    --text: #f4f4f4;
    --text-2: #b7c0d4;
    --text-3: #7d879c;
    --on: #1a1c2c;
    --danger: #e04a5f;
    --accent: #ffcd75;
    --fill: #e8b13a;
    --fill-2: #2a3148;
    --line: #3a4466;
    --good: #38b764;
    --hp: #e04a5f;
    --zy: #3fb8d8;
    --exp: #e8b13a;
    --shadow: #3a4466;
    --font: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", "Heiti SC", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0c0e16;
    color: var(--text);
    font-family: var(--font);
    overflow: hidden;
    position: fixed;
    inset: 0;
    width: 100%;
    touch-action: none;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  #app {
    height: 100%;
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    overflow: hidden;
    position: relative;
  }
  .scroll {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    overscroll-behavior: contain;
  }
  #title, #play { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #title { padding: 0 0 16px; }
  #play { gap: 8px; padding: 8px 0 0; }
  .banner {
    width: 100%;
    height: auto;
    display: block;
    image-rendering: pixelated;
    background: #1a1c2c;
  }
  .pad { padding: 0 12px; }
  h1 {
    margin: 12px 0 4px;
    font-size: 28px;
    letter-spacing: 3px;
    font-weight: 700;
    text-align: center;
  }
  .sub {
    text-align: center;
    color: var(--text-2);
    font-size: 13px;
    line-height: 1.55;
    margin: 0 0 10px;
  }
  .kicker {
    text-align: center;
    letter-spacing: 3px;
    color: var(--text-3);
    font-size: 12px;
    margin-top: 12px;
  }
  .help {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin: 8px 0 12px;
  }
  .help div {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 12px;
    line-height: 1.45;
    color: var(--text-2);
  }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .chapters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .chapter-btn { min-height: 64px !important; font-size: 13px !important; align-items: flex-start !important; text-align: left; }
  .chapter-btn small { display: block; font-weight: 500; color: var(--text-2); font-size: 11px; line-height: 1.35; margin-top: 2px; }
  .btn.primary .chapter-btn small, .chapter-btn.primary small { color: #3a3320; }
  .credits { font-size: 10px; color: var(--text-3); line-height: 1.45; margin: 12px 0 4px; }
  .panel {
    background: var(--elev);
    border: 2px solid var(--text);
    border-radius: 12px;
    box-shadow: 0 4px 0 var(--shadow);
    padding: 10px;
  }
  .btn {
    min-height: 44px;
    padding: 6px 12px;
    border-radius: 10px;
    border: 2px solid var(--text);
    border-bottom-width: 5px;
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    font-weight: 650;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    touch-action: manipulation;
    line-height: 1.3;
  }
  .btn.primary { background: var(--fill); color: var(--on); }
  .btn.column { flex-direction: column; align-items: flex-start; text-align: left; gap: 2px; }
  .btn.column small { display: block; font-size: 11px; font-weight: 500; line-height: 1.35; }
  .btn.primary.column small { color: #3d3420; }
  .btn.between { justify-content: space-between; text-align: left; }
  .btn:active:not(:disabled) { border-bottom-width: 2px; transform: translateY(3px); }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .btn.tiny { min-height: 40px; width: 96px; font-size: 12px; padding: 4px 6px; flex: none; }
  .btn.round {
    width: 66px;
    height: 66px;
    min-height: 66px;
    border-radius: 999px;
    padding: 0;
    font-family: var(--mono);
    font-size: 24px;
  }
  .btn.round.sm { width: 54px; height: 54px; min-height: 54px; font-size: 20px; }
  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    background: var(--fill);
    color: var(--on);
    font-size: 12px;
    font-weight: 700;
    line-height: 18px;
  }
  .hud {
    margin: 0 10px;
    display: flex;
    gap: 10px;
    align-items: center;
    position: relative;
  }
  .portrait {
    image-rendering: pixelated;
    border-radius: 8px;
    border: 2px solid var(--text);
    display: block;
    flex-shrink: 0;
    background: #1a1c2c;
    width: 52px;
    height: 52px;
  }
  .portrait.lg { width: 64px; height: 64px; }
  .bars { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .who-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .who-row .name {
    font-size: 14px;
    font-weight: 700;
    min-width: 0;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .who-row .meta { font-size: 11px; color: var(--text-2); font-weight: 500; }
  .who-row .right { display: flex; align-items: center; gap: 6px; flex: none; }
  .stones {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    padding: 1px 8px;
    border-radius: 999px;
    border: 2px solid var(--text);
    white-space: nowrap;
  }
  .bar {
    display: grid;
    grid-template-columns: 34px 1fr 64px;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 650;
  }
  .bar .track {
    height: 10px;
    border-radius: 3px;
    border: 2px solid var(--text);
    background: var(--fill-2);
    overflow: hidden;
  }
  .bar .fill {
    height: 100%;
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0) 0 6px, rgba(0,0,0,0.18) 6px 7px);
  }
  .bar .num { font-family: var(--mono); text-align: right; color: var(--text-2); font-weight: 500; }
  #view-wrap {
    margin: 0 10px;
    display: flex;
    justify-content: center;
    background: #1a1c2c;
    border: 3px solid var(--text);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 0 var(--shadow);
    line-height: 0;
    flex: none;
  }
  #view {
    width: 352px;
    height: 288px;
    display: block;
    image-rendering: pixelated;
    touch-action: none;
    background: #1a1c2c;
  }
  #panel { flex: 1; min-height: 0; padding: 14px 10px 10px; }
  .obj { display: flex; gap: 6px; align-items: flex-start; }
  .obj span.txt { font-size: 13px; line-height: 1.45; font-weight: 700; }
  .toast { font-size: 12px; line-height: 1.45; color: var(--text-2); margin-top: 4px; }
  .toast.accent { color: var(--accent); }
  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 6px;
  }
  .dpad {
    display: grid;
    grid-template-columns: 46px 46px 46px;
    grid-template-rows: 46px 46px 46px;
    grid-template-areas: ". u ." "l c r" ". d .";
    gap: 2px;
    padding: 6px;
    border-radius: 999px;
    background: var(--fill-2);
  }
  .dpad button {
    border-radius: 10px;
    border: 2px solid var(--text);
    border-bottom-width: 5px;
    background: var(--bg);
    color: var(--text);
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    touch-action: none;
    font-family: inherit;
  }
  .dpad button.down { border-bottom-width: 2px; transform: translateY(3px); background: #343c58; }
  .dpad .u { grid-area: u; } .dpad .l { grid-area: l; } .dpad .r { grid-area: r; } .dpad .d { grid-area: d; }
  .dpad .c { grid-area: c; border-radius: 999px; margin: 10px; background: var(--line); }
  .ab { display: flex; align-items: flex-end; gap: 12px; padding-right: 4px; }
  .ab .col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .ab .col span { font-size: 11px; color: var(--text-2); }
  .ab .a { margin-bottom: 18px; }
  .dlg { position: relative; padding-top: 16px; display: flex; flex-direction: column; gap: 10px; }
  .dlg .tag { position: absolute; top: -12px; left: 12px; }
  .dlg-row { display: flex; gap: 10px; align-items: flex-start; }
  .dlg-text { flex: 1; font-size: 15px; line-height: 1.55; min-height: 72px; }
  .dlg-text.narr { font-style: italic; color: var(--text-2); }
  .dlg-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .muted { color: var(--text-3); font-family: var(--mono); font-size: 11px; }
  .logbox {
    background: var(--bg);
    border: 2px solid var(--line);
    border-radius: 8px;
    padding: 6px 10px;
    min-height: 58px;
    font-size: 13px;
    line-height: 1.45;
  }
  .logbox .old { color: var(--text-2); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .stat {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px 6px;
  }
  .stat b { display: block; font-size: 13px; }
  .stat i { font-style: normal; font-size: 10px; color: var(--text-2); }
  .hpbar {
    height: 10px;
    border-radius: 3px;
    border: 2px solid var(--text);
    background: var(--fill-2);
    overflow: hidden;
  }
  .hpbar i { display: block; height: 100%; background: var(--hp); }
  .rowcard {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 2px solid var(--line);
    border-radius: 10px;
    padding: 8px;
  }
  .rowcard .grow { flex: 1; min-width: 0; }
  .rowcard .nm { font-size: 13px; font-weight: 700; }
  .rowcard .ds { font-size: 11px; color: var(--text-2); }
  .sat {
    height: 8px;
    margin: 4px 0;
    border-radius: 2px;
    border: 1px solid var(--line);
    background: var(--fill-2);
    overflow: hidden;
  }
  .sat i { display: block; height: 100%; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
  .chip b { font-family: var(--mono); font-weight: 600; }
  .saveflag {
    font-size: 10px;
    font-weight: 700;
    color: var(--good);
    opacity: 0;
    width: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .saveflag.on { opacity: 1; width: auto; }
  .section-label { font-size: 12px; font-weight: 700; margin-top: 2px; }
  .center-col { text-align: center; display: flex; flex-direction: column; gap: 10px; padding: 8px; }
  .danger-title { font-size: 22px; font-weight: 700; color: var(--danger); letter-spacing: 2px; }
  .note { font-size: 11px; color: var(--text-2); line-height: 1.45; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; min-height: 20px; align-items: center; }
  .warn { font-size: 12px; color: var(--danger); font-weight: 700; }
</style>
</head>
<body>
<div id="app">
  <div id="title" class="scroll"></div>
  <div id="play" hidden>
    <div id="hud"></div>
    <div id="view-wrap"><canvas id="view" width="352" height="288"></canvas></div>
    <div id="panel" class="scroll"></div>
  </div>
</div>
<script src="hd.js"></script>
<script src="game.js"></script>
</body>
</html>
