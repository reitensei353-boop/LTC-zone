<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="鹿鼎记">
<meta name="theme-color" content="#0a0707">
<meta name="description" content="鹿鼎记：扬州丽春院。横屏，照着烟雨江湖的地图和界面。">
<title>鹿鼎记</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="turn"><div><b>请横屏</b><small>把手机横过来</small></div></div>
<div id="app">
  <canvas id="view" width="844" height="390"></canvas>
  <header id="top">
    <div class="res"><i class="heart"></i><span id="sta">体力 92/100</span><button type="button" id="sta-plus" class="plus">+</button></div>
    <div class="res"><i class="coin"></i><span id="wen">0两46文</span></div>
    <div class="res"><i class="gold"></i><span id="gold">0两</span><button type="button" class="plus" id="gold-plus">+</button></div>
    <button type="button" id="notice" class="notice">公告</button>
  </header>
  <aside id="quest"></aside>
  <aside id="side">
    <div class="grid2">
      <button type="button" data-menu="act">活动</button>
      <button type="button" data-menu="menu">菜单</button>
      <button type="button" data-menu="shop">商城</button>
      <button type="button" data-menu="comm">社区</button>
    </div>
    <div class="locbox">
      <div id="locname">扬州 (10,8)</div>
      <div id="hours" class="hours"></div>
    </div>
    <div id="near" class="near"></div>
  </aside>
  <nav id="dock"></nav>
  <div id="dlg" hidden>
    <div class="bust-frame"><img id="dlg-bust" alt=""></div>
    <div class="dlg-main">
      <div id="dlg-name" class="nameplate"></div>
      <p id="dlg-text"></p>
      <div id="dlg-hint">轻点继续</div>
    </div>
  </div>
  <div id="choices" hidden></div>
  <div id="panel" hidden>
    <div class="sheet">
      <div class="roller"><span id="roller-title">属性</span><div class="tassel" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div>
      <div id="paper" class="paper"></div>
      <div id="party-col" class="party-col"></div>
    </div>
    <button type="button" id="panel-x" class="closex">关闭</button>
  </div>
  <div id="battle" hidden>
    <img id="battle-bg" alt="" src="assets/bg_alley.webp">
    <div id="b-round">回合 1/99</div>
    <div id="b-call"></div>
    <div id="b-units"></div>
    <canvas id="fx" width="844" height="390"></canvas>
    <div id="b-skills"></div>
  </div>
  <div id="end" hidden>
    <div class="end-card">
      <div class="end-title">未完待续</div>
      <p id="end-text"></p>
      <button type="button" id="end-back">再在坊里走走</button>
    </div>
  </div>
  <div id="tip" hidden></div>
  <div id="menu-pop" hidden></div>
  <div class="bezel" aria-hidden="true"></div>
  <i class="corn tl"></i><i class="corn tr"></i><i class="corn bl"></i><i class="corn br"></i>
</div>
<script src="js/game.js"></script>
</body>
</html>
