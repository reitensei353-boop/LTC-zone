<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="鹿鼎记">
<meta name="theme-color" content="#1c1814">
<meta name="description" content="鹿鼎记：水墨回合制。韦小宝从扬州丽春院到北京，直到擒鳌拜。">
<title>鹿鼎记</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="vlabel"></div>
  <header id="top" hidden>
    <div class="loc-row">
      <div class="loc-name" id="loc-name"></div>
      <div class="silver" id="silver"></div>
    </div>
    <div class="meters">
      <div class="meter">
        <div class="cap"><span>气血</span><span id="hp-n"></span></div>
        <div class="track"><i id="hp-b"></i></div>
      </div>
      <div class="meter mp">
        <div class="cap"><span>内力</span><span id="mp-n"></span></div>
        <div class="track"><i id="mp-b"></i></div>
      </div>
    </div>
    <div class="quest" id="quest" hidden></div>
  </header>
  <div id="spots"></div>
  <div id="floaters"></div>
  <div id="toast"></div>
  <section id="dock">
    <div id="dlg" class="paper" hidden>
      <div id="dlg-port"><canvas id="face" width="192" height="192"></canvas></div>
      <div id="dlg-body">
        <div id="dlg-name"></div>
        <p id="dlg-text"></p>
        <div id="dlg-hint">轻点继续</div>
      </div>
    </div>
    <div id="choices" hidden></div>
    <div id="battle" class="paper" hidden>
      <div class="b-head">
        <div class="b-who">
          <b id="b-name"></b>
          <small id="b-title"></small>
          <div class="track b-track"><i id="b-hp"></i></div>
        </div>
        <canvas id="b-face" width="128" height="128"></canvas>
      </div>
      <p id="b-log"></p>
      <div class="b-you" id="b-you"></div>
      <div id="skills"></div>
    </div>
    <nav id="tabs" hidden>
      <button type="button" class="tab" data-panel="char">人物</button>
      <button type="button" class="tab" data-panel="bag">背包</button>
      <button type="button" class="tab" data-panel="arts">武学</button>
      <button type="button" class="tab" data-panel="quests">任务</button>
      <button type="button" class="tab" data-panel="map">地图</button>
    </nav>
  </section>
  <div id="panel" hidden>
    <div class="panel-card paper" id="panel-body"></div>
  </div>
  <div id="title">
    <p class="title-note">金庸《鹿鼎记》 · 扬州至擒鳌</p>
    <div class="actions">
      <button type="button" id="btn-new" class="title-btn">新的故事</button>
      <button type="button" id="btn-cont" class="title-btn" hidden>继续前缘</button>
      <button type="button" id="btn-sheet" class="title-btn ghost">人物图鉴</button>
    </div>
  </div>
</div>
<script src="js/art.js"></script>
<script src="js/story.js"></script>
<script src="js/game.js"></script>
</body>
</html>
