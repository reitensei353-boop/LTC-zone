<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>造梦西游3 - 悟空闯关（原创同人小游戏）</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a2a4a; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        canvas { display: block; max-width: 100%; border: 2px solid #d4a017; box-shadow: 0 0 40px rgba(255,180,0,0.5); cursor: default; }
        #back-btn { position: absolute; top: 14px; left: 14px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); color: #fff; padding: 7px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; backdrop-filter: blur(6px); }
        #back-btn:hover { background: rgba(255,255,255,0.22); }
    </style>
</head>
<body>
<button id="back-btn" onclick="history.back()">← 返回</button>
<canvas id="game" width="800" height="450"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 800, H = 450, GY = H - 80;

// ---- Input ----
const keys = {};
document.addEventListener('keydown', e => {
    const prev = keys[e.code];
    keys[e.code] = true;
    e.preventDefault();
    if (e.code === 'Tab' && !prev) toggleSkillTree();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// ---- Mouse ----
let mouseX = 0, mouseY = 0;
canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    mouseX = (e.clientX - r.left) * (W / r.width);
    mouseY = (e.clientY - r.top) * (H / r.height);
});
canvas.addEventListener('click', e => {
    const r = canvas.getBoundingClientRect();
    handleSkillTreeClick((e.clientX - r.left) * (W / r.width), (e.clientY - r.top) * (H / r.height));
});

// ---- Helpers ----
function rand(a, b) { return a + Math.random() * (b - a); }
function rectsOverlap(a, b) { return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }
function hexRgb(hex) {
    const r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return r ? `${parseInt(r[1],16)},${parseInt(r[2],16)},${parseInt(r[3],16)}` : '128,128,128';
}
// Attack swing: slow windup -> fast forward strike (peaks near-horizontal, matching hitBox reach) -> settle
function attackSwingAngle(ph) {
    if (ph < 0.35) { const t = ph/0.35; return -1.0 + t*0.15; }
    if (ph < 0.55) { const t = (ph-0.35)/0.20; return -0.85 + t*2.15; }
    const t = Math.min(1, (ph-0.55)/0.45); return 1.3 - t*0.8;
}

// ---- Game State ----
let score = 0, wave = 1, maxWave = 1, gameState = 'play';
let enemies = [], projectiles = [];

// ---- Juice: hit-stop & screen shake (打击感) ----
let hitStop = 0;
let shakeTimer = 0, shakeMag = 0;
function triggerHitStop(frames) { hitStop = Math.max(hitStop, frames); }
function triggerShake(mag, frames) { shakeMag = Math.max(shakeMag, mag); shakeTimer = Math.max(shakeTimer, frames); }
// Central "landed a hit" handler: damage number + spark burst + knockback + shake + hit-stop, all in one place
function dealHit(e, dmg, opts = {}) {
    const { textColor = '#ffff00', sparkHue = 45, sparkN = 8, knockPower = 6,
            shakeAmt = 3, shakeFrames = 6, stopFrames = 4, sourceX = null, dir = null } = opts;
    e.takeDamage(dmg);
    addNum(e.x + e.w/2, e.y - e.h - 10, dmg, textColor);
    addSpark(e.x + e.w/2, e.y - e.h/2, sparkN, sparkHue);
    const kd = dir != null ? dir : (Math.sign((e.x + e.w/2) - (sourceX != null ? sourceX : player.x + player.w/2)) || 1);
    e.kx = (e.kx || 0) + kd * knockPower;
    triggerShake(shakeAmt, shakeFrames);
    triggerHitStop(stopFrames);
}

// ---- Effects ----
const effects = [];
function addSpark(x, y, n = 8, hue = 45) {
    for (let i = 0; i < n; i++) {
        const a = rand(0, Math.PI*2), s = rand(2, 6);
        effects.push({ type:'spark', x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-2,
            life:rand(12,22), maxLife:22, color:`hsl(${hue+rand(-15,15)},100%,${rand(60,80)}%)`, size:rand(2,5) });
    }
}
function addNum(x, y, text, color = '#ffff00') {
    effects.push({ type:'num', x, y, vy:-1.6, life:50, maxLife:50, text, color });
}
function addBurst(x, y, hue = 45, n = 20) {
    for (let i = 0; i < n; i++) {
        const a = (i/n)*Math.PI*2, s = rand(4,9);
        effects.push({ type:'spark', x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-3,
            life:40, maxLife:40, color:`hsl(${hue+rand(-20,20)},100%,70%)`, size:rand(4,8) });
    }
}
function updateEffects() {
    for (let i = effects.length-1; i >= 0; i--) {
        const e = effects[i];
        if (--e.life <= 0) { effects.splice(i, 1); continue; }
        if (e.type === 'spark') { e.x += e.vx; e.y += e.vy; e.vy += 0.3; e.vx *= 0.94; }
        else { e.y += e.vy; }
    }
}
function drawEffects() {
    effects.forEach(e => {
        const a = e.life / e.maxLife;
        ctx.save(); ctx.globalAlpha = a;
        if (e.type === 'spark') {
            ctx.fillStyle = e.color;
            ctx.beginPath(); ctx.arc(e.x, e.y, e.size*a, 0, Math.PI*2); ctx.fill();
        } else {
            ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
            ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.fillStyle = e.color;
            ctx.strokeText(e.text, e.x, e.y); ctx.fillText(e.text, e.x, e.y);
        }
        ctx.restore();
    });
}

// ---- Projectile (棒影/棍气) ----
class Projectile {
    constructor(x, y, vx, color) {
        this.x = x; this.y = y; this.vx = vx; this.w = 76; this.h = 12;
        this.dmg = Math.floor(rand(35, 55)); this.color = color;
        this.hitSet = new Set(); this.life = 100;
    }
    update() {
        this.x += this.vx; this.life--;
        enemies.forEach(e => {
            if (e.dead || this.hitSet.has(e)) return;
            if (rectsOverlap({x:this.x-this.w/2,y:this.y-this.h/2,w:this.w,h:this.h}, {x:e.x,y:e.y-e.h,w:e.w,h:e.h})) {
                dealHit(e, this.dmg, { textColor:'#ffee88', sparkHue:45, sparkN:8, knockPower:5, shakeAmt:2, shakeFrames:5, stopFrames:3, dir:Math.sign(this.vx)||1 });
                this.hitSet.add(e);
                player.combo++; player.comboTimer = 150;
            }
        });
    }
    draw() {
        const a = Math.min(1, this.life/20); ctx.save(); ctx.globalAlpha = a;
        ctx.shadowColor = this.color; ctx.shadowBlur = 14; ctx.fillStyle = this.color;
        ctx.fillRect(this.x-this.w/2, this.y-this.h/2, this.w, this.h);
        ctx.fillStyle = '#fff8dd'; ctx.fillRect(this.x-this.w/2, this.y-2, this.w, 4);
        ctx.restore();
    }
    get dead() { return this.life <= 0 || this.x < -100 || this.x > W+100; }
}

// ---- Skill Definitions (西游主题) ----
const SKILLS = [
    { id:'ruyisweep', name:'如意横扫', icon:'🪄', desc:'金箍棒全屏扫击', mpCost:30, maxCd:200, unlockWave:1, color:'#ffcc00',
      execute(p) {
          addBurst(p.x+p.w/2, p.y-p.h/2, 45);
          let hits = 0;
          enemies.forEach(e => {
              if (e.dead) return;
              const d = Math.floor(rand(60,90));
              dealHit(e, d, { textColor:'#ffee00', sparkHue:45, sparkN:12, knockPower:7, shakeAmt:4, shakeFrames:8, stopFrames:5, sourceX:p.x+p.w/2 });
              hits++;
          });
          if (hits) { p.combo += hits; p.comboTimer = 150; }
      }
    },
    { id:'cloudsomersault', name:'筋斗云', icon:'☁️', desc:'腾云驾雾向前冲刺击穿敌人', mpCost:20, maxCd:120, unlockWave:1, color:'#88ccff',
      execute(p) {
          const dir = p.facing, dist = 220;
          const tx = Math.max(0, Math.min(W-p.w, p.x + dir*dist));
          const box = { x:dir>0?p.x:tx, y:p.y-p.h, w:Math.abs(tx-p.x)+p.w, h:p.h };
          for (let i = 0; i < 8; i++) addSpark(p.x+p.w/2 - dir*i*20, p.y-p.h/2, 3, 200);
          p.x = tx;
          enemies.forEach(e => {
              if (e.dead) return;
              if (rectsOverlap(box, {x:e.x,y:e.y-e.h,w:e.w,h:e.h})) {
                  const d = Math.floor(rand(40,60));
                  dealHit(e, d, { textColor:'#88ccff', sparkHue:200, sparkN:10, knockPower:8, shakeAmt:3, shakeFrames:6, stopFrames:4, dir });
                  p.combo++; p.comboTimer = 150;
              }
          });
      }
    },
    { id:'earthshake', name:'定海神通', icon:'🌊', desc:'金箍棒砸地引发冲击波', mpCost:25, maxCd:180, unlockWave:2, color:'#66ddaa',
      execute(p) {
          const cx = p.x+p.w/2;
          addBurst(cx, p.y, 150);
          enemies.forEach(e => {
              if (e.dead) return;
              const dist = Math.abs((e.x+e.w/2) - cx);
              if (dist < 200) {
                  const d = Math.floor(rand(40,65) * (1 - dist/400));
                  dealHit(e, d, { textColor:'#66ddaa', sparkHue:150, sparkN:10, knockPower:6, shakeAmt:5, shakeFrames:8, stopFrames:4, sourceX:cx });
                  p.combo++; p.comboTimer = 150;
              }
          });
      }
    },
    { id:'goldeneye', name:'火眼金睛', icon:'👁️', desc:'看穿弱点，重击锁定最近敌人', mpCost:40, maxCd:250, unlockWave:2, color:'#ff6a2e',
      execute(p) {
          addBurst(p.x+p.w/2, p.y-p.h/2, 20);
          const tgt = enemies.filter(e=>!e.dead).sort((a,b) =>
              Math.abs(a.x+a.w/2-p.x-p.w/2) - Math.abs(b.x+b.w/2-p.x-p.w/2))[0];
          if (tgt) {
              const d = Math.floor(rand(110,160));
              dealHit(tgt, d, { textColor:'#ff6a2e', sparkHue:20, sparkN:20, knockPower:10, shakeAmt:6, shakeFrames:10, stopFrames:8, sourceX:p.x+p.w/2 });
              p.combo += 3; p.comboTimer = 180;
          }
      }
    },
    { id:'clones', name:'七十二变', icon:'🐒', desc:'分身连击多个敌人', mpCost:35, maxCd:160, unlockWave:3, color:'#c8a2ff',
      execute(p) {
          const targets = enemies.filter(e=>!e.dead).slice(0, 4);
          targets.forEach((e, i) => {
              setTimeout(() => {
                  if (e.dead) return;
                  const d = Math.floor(rand(45,70));
                  dealHit(e, d, { textColor:'#c8a2ff', sparkHue:270, sparkN:8, knockPower:5, shakeAmt:2, shakeFrames:5, stopFrames:2, sourceX:p.x+p.w/2 });
                  p.combo++; p.comboTimer = 150;
              }, i * 120);
          });
      }
    },
    { id:'staffwave', name:'流光棒影', icon:'〰️', desc:'掷出棍气横扫全场', mpCost:25, maxCd:140, unlockWave:3, color:'#ffe28a',
      execute(p) { projectiles.push(new Projectile(p.x+p.w/2, p.y-p.h/2, p.facing*10, '#ffe28a')); }
    },
    { id:'peach', name:'蟠桃续命', icon:'🍑', desc:'吃下蟠桃回复30点HP', mpCost:50, maxCd:300, unlockWave:5, color:'#ff8fa8',
      execute(p) {
          const heal = Math.min(30, p.maxHp - p.hp);
          p.hp += heal;
          addBurst(p.x+p.w/2, p.y-p.h/2, 340, 12);
          addNum(p.x+p.w/2, p.y-p.h-20, `+${heal}HP`, '#ff8fa8');
      }
    },
    { id:'divinepower', name:'齐天神力', icon:'💪', desc:'10秒攻击力+80%', mpCost:45, maxCd:400, unlockWave:5, color:'#ff8800',
      execute(p) { p.berserkTimer = 600; addBurst(p.x+p.w/2, p.y-p.h/2, 30); }
    },
];

// ---- Skill Equip State ----
// 4 slots for U I O L keys
let equippedSkills = ['ruyisweep', 'cloudsomersault', null, null];
let slotCDs = [0, 0, 0, 0];
const SLOT_KEYS = ['KeyU', 'KeyI', 'KeyO', 'KeyL'];
const SLOT_LABELS = ['U', 'I', 'O', 'L'];

function getSkill(id) { return SKILLS.find(s => s.id === id) || null; }
function isUnlocked(sk) { return maxWave >= sk.unlockWave; }

// ---- Skill Tree UI ----
let skillTreeOpen = false;
let selectedId = null;

// Layout (absolute canvas coords)
const ST = { ox:40, oy:30, ow:720, oh:390, cw:140, ch:70, gap:14, perRow:4, sx:64, sy:100, slx:64, sly:282, slw:158, slh:74 };

function skillRect(i) {
    return { x: ST.sx + (i % ST.perRow)*(ST.cw+ST.gap), y: ST.sy + Math.floor(i/ST.perRow)*(ST.ch+ST.gap), w:ST.cw, h:ST.ch };
}
function slotRect(i) { return { x: ST.slx + i*(ST.slw+ST.gap), y: ST.sly, w:ST.slw, h:ST.slh }; }

function toggleSkillTree() {
    skillTreeOpen = !skillTreeOpen;
    if (!skillTreeOpen) selectedId = null;
}

function handleSkillTreeClick(mx, my) {
    if (!skillTreeOpen) return;
    SKILLS.forEach((sk, i) => {
        const r = skillRect(i);
        if (mx >= r.x && mx <= r.x+r.w && my >= r.y && my <= r.y+r.h && isUnlocked(sk))
            selectedId = selectedId === sk.id ? null : sk.id;
    });
    SLOT_LABELS.forEach((_, i) => {
        const r = slotRect(i);
        if (mx >= r.x && mx <= r.x+r.w && my >= r.y && my <= r.y+r.h) {
            if (selectedId) { equippedSkills[i] = selectedId; slotCDs[i] = 0; selectedId = null; }
            else { equippedSkills[i] = null; slotCDs[i] = 0; }
        }
    });
}

function drawSkillTree() {
    if (!skillTreeOpen) return;

    // backdrop
    ctx.fillStyle = 'rgba(10,20,40,0.94)'; ctx.fillRect(ST.ox, ST.oy, ST.ow, ST.oh);
    ctx.strokeStyle = '#d4a017'; ctx.lineWidth = 2; ctx.strokeRect(ST.ox, ST.oy, ST.ow, ST.oh);

    // title
    ctx.fillStyle = '#ffd35c'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('神通谱', ST.ox + ST.ow/2, ST.oy + 36);

    // skills section label
    ctx.fillStyle = '#a0b0c8'; ctx.font = '12px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('可用神通  (点击卡片选择)', ST.sx, ST.sy - 10);

    // skill cards
    SKILLS.forEach((sk, i) => {
        const r = skillRect(i);
        const unlocked = isUnlocked(sk);
        const sel = selectedId === sk.id;
        const slotIdx = equippedSkills.indexOf(sk.id);
        const equipped = slotIdx !== -1;

        ctx.fillStyle = sel ? `rgba(${hexRgb(sk.color)},0.28)` : unlocked ? 'rgba(16,28,48,0.95)' : 'rgba(8,14,24,0.95)';
        ctx.fillRect(r.x, r.y, r.w, r.h);
        ctx.strokeStyle = sel ? sk.color : unlocked ? (equipped ? sk.color+'99' : '#334466') : '#182233';
        ctx.lineWidth = sel ? 2.5 : 1.5;
        ctx.strokeRect(r.x, r.y, r.w, r.h);

        ctx.globalAlpha = unlocked ? 1 : 0.3;
        ctx.font = '20px sans-serif'; ctx.textAlign = 'left';
        ctx.fillText(sk.icon, r.x+6, r.y+26);
        ctx.fillStyle = unlocked ? sk.color : '#556677'; ctx.font = 'bold 11px sans-serif';
        ctx.fillText(sk.name, r.x+32, r.y+20);
        ctx.fillStyle = unlocked ? '#bbb' : '#445566'; ctx.font = '9px sans-serif';
        ctx.fillText(sk.desc, r.x+32, r.y+32);
        ctx.fillStyle = unlocked ? '#77aabb' : '#334455'; ctx.font = '9px sans-serif';
        ctx.fillText(`MP:${sk.mpCost}  CD:${(sk.maxCd/60).toFixed(1)}s`, r.x+6, r.y+58);

        if (!unlocked) {
            ctx.fillStyle = '#778899'; ctx.font = '9px sans-serif'; ctx.textAlign = 'right';
            ctx.fillText(`🔒 第${sk.unlockWave}波`, r.x+r.w-5, r.y+58);
        }
        if (equipped && unlocked) {
            ctx.fillStyle = sk.color; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'right';
            ctx.fillText(`[${SLOT_LABELS[slotIdx]}]`, r.x+r.w-5, r.y+13);
        }
        ctx.globalAlpha = 1;
    });

    // divider
    ctx.strokeStyle = 'rgba(212,160,23,0.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(ST.ox+20, ST.sly-14); ctx.lineTo(ST.ox+ST.ow-20, ST.sly-14); ctx.stroke();

    // slots section label
    ctx.fillStyle = '#a0b0c8'; ctx.font = '12px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('装备槽位  (选择神通后点击槽位装备，再次点击卸下)', ST.slx, ST.sly-2);

    // slot boxes
    SLOT_LABELS.forEach((lbl, i) => {
        const r = slotRect(i);
        const sk = getSkill(equippedSkills[i]);
        ctx.fillStyle = sk ? `rgba(${hexRgb(sk.color)},0.1)` : 'rgba(14,22,40,0.8)';
        ctx.fillRect(r.x, r.y, r.w, r.h);
        ctx.strokeStyle = sk ? sk.color : '#334466'; ctx.lineWidth = 2;
        ctx.strokeRect(r.x, r.y, r.w, r.h);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'left';
        ctx.fillText(`[${lbl}]`, r.x+8, r.y+20);
        if (sk) {
            ctx.font = '20px sans-serif'; ctx.fillText(sk.icon, r.x+8, r.y+50);
            ctx.fillStyle = sk.color; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'left';
            ctx.fillText(sk.name, r.x+36, r.y+42);
            ctx.fillStyle = '#aaa'; ctx.font = '9px sans-serif';
            ctx.fillText(`MP:${sk.mpCost}`, r.x+36, r.y+56);
        } else {
            ctx.fillStyle = '#334466'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText('空', r.x+r.w/2, r.y+r.h/2+5);
        }
    });

    // bottom hints
    ctx.textAlign = 'center'; ctx.font = '12px sans-serif';
    if (selectedId) {
        const sk = getSkill(selectedId);
        ctx.fillStyle = '#fff';
        ctx.fillText(`已选「${sk.name}」→ 点击槽位装备`, ST.ox+ST.ow/2, ST.oy+ST.oh-28);
    }
    ctx.fillStyle = 'rgba(200,170,120,0.65)';
    ctx.fillText('Tab 关闭神通谱', ST.ox+ST.ow/2, ST.oy+ST.oh-10);
}

// ---- Player (孙悟空) ----
const player = {
    x:100, y:GY, w:36, h:60, vx:0, vy:0,
    hp:100, maxHp:100, mp:100, maxMp:100,
    speed:5, facing:1, onGround:false, state:'idle',
    atkTimer:0, atkDur:22, atkCD:0,
    invTimer:0, combo:0, comboTimer:0, walkFrame:0, berserkTimer:0,

    hitBox() { return {x:this.facing>0?this.x+this.w:this.x-75, y:this.y-this.h+5, w:75, h:this.h-10}; },

    doAttack() {
        if (this.atkCD>0 || this.state==='attack' || this.state==='skill') return;
        this.state='attack'; this.atkTimer=this.atkDur; this.atkCD=25;
        const hb = this.hitBox(); let hit = false;
        enemies.forEach(e => {
            if (e.dead) return;
            if (rectsOverlap(hb, {x:e.x,y:e.y-e.h,w:e.w,h:e.h})) {
                let d = Math.floor(rand(20,35));
                if (this.berserkTimer > 0) d = Math.floor(d * 1.8);
                dealHit(e, d, {
                    textColor: this.berserkTimer>0 ? '#ff8800' : '#ffff00',
                    sparkHue: 45, sparkN: 10,
                    knockPower: this.berserkTimer>0 ? 9 : 6,
                    shakeAmt: 3, shakeFrames: 6, stopFrames: 4,
                    sourceX: this.x+this.w/2
                });
                hit = true;
            }
        });
        if (hit) { this.combo++; this.comboTimer=150; this.mp=Math.min(this.maxMp,this.mp+3); }
    },

    doSlotSkill(i) {
        if (this.state==='skill') return;
        const sk = getSkill(equippedSkills[i]); if (!sk) return;
        if (slotCDs[i]>0 || this.mp<sk.mpCost) return;
        this.state='skill'; this.atkTimer=25; slotCDs[i]=sk.maxCd; this.mp-=sk.mpCost;
        sk.execute(this);
    },

    takeDamage(d, sourceX) {
        if (this.invTimer>0) return;
        this.hp=Math.max(0,this.hp-d); this.invTimer=80;
        addSpark(this.x+this.w/2, this.y-this.h/2, 6);
        const dir = (sourceX != null ? Math.sign((this.x+this.w/2) - sourceX) : 0) || -this.facing;
        this.x = Math.max(0, Math.min(W-this.w, this.x + dir*10));
        triggerShake(3, 6);
        if (this.hp<=0) gameState='over';
    },

    update() {
        if (gameState!=='play' || skillTreeOpen) return;
        this.vx=0;
        const free = this.state!=='attack' && this.state!=='skill';
        if (free) {
            if (keys['KeyA']||keys['ArrowLeft'])  { this.vx=-this.speed; this.facing=-1; }
            if (keys['KeyD']||keys['ArrowRight']) { this.vx=this.speed;  this.facing=1; }
        }
        if (keys['KeyK'] && this.onGround) { this.vy=-15; this.onGround=false; keys['KeyK']=false; }
        if (keys['KeyJ']) { keys['KeyJ']=false; this.doAttack(); }
        SLOT_KEYS.forEach((k,i) => { if (keys[k]) { keys[k]=false; this.doSlotSkill(i); } });

        this.vy+=0.75; this.x+=this.vx; this.y+=this.vy;
        if (this.y>=GY) { this.y=GY; this.vy=0; this.onGround=true; }
        this.x=Math.max(0,Math.min(W-this.w,this.x));

        if (this.state==='attack'||this.state==='skill') { if(--this.atkTimer<=0) this.state='idle'; }
        else if (!this.onGround) this.state='jump';
        else if (this.vx!==0) { this.state='walk'; this.walkFrame++; }
        else this.state='idle';

        if (this.atkCD>0) this.atkCD--;
        slotCDs = slotCDs.map(cd => cd>0?cd-1:0);
        if (this.invTimer>0) this.invTimer--;
        if (this.berserkTimer>0) this.berserkTimer--;
        if (this.mp<this.maxMp) this.mp=Math.min(this.maxMp,this.mp+0.08);
        if (this.comboTimer>0) this.comboTimer--; else this.combo=0;
    },

    draw() {
        ctx.save();
        if (this.invTimer>0 && Math.floor(this.invTimer/5)%2) ctx.globalAlpha=0.35;
        if (this.berserkTimer>0) { ctx.shadowColor='#ff6600'; ctx.shadowBlur=18; }
        const cx=this.x+this.w/2;
        ctx.translate(cx,this.y); ctx.scale(this.facing,1);

        ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(0,1,18,5,0,0,Math.PI*2); ctx.fill();

        const ls = this.state==='walk' ? Math.sin(this.walkFrame*0.25)*8 : 0;
        // legs
        ctx.fillStyle='#a83c1e';
        ctx.save(); ctx.translate(-8,-28); ctx.rotate(ls*0.03);  ctx.fillRect(-5,0,11,28); ctx.restore();
        ctx.save(); ctx.translate(8,-28);  ctx.rotate(-ls*0.03); ctx.fillRect(-5,0,11,28); ctx.restore();
        // 云头鞋
        ctx.fillStyle='#e0d0a0'; ctx.fillRect(-18,-8,14,8); ctx.fillRect(4,-8,14,8);

        // 虎皮裙 body
        ctx.fillStyle = this.berserkTimer>0 ? '#cc4400' : '#d97a1f'; ctx.fillRect(-16,-58,32,32);
        ctx.fillStyle = '#f2c14e';
        ctx.fillRect(-14,-56,6,28); ctx.fillRect(-2,-56,6,28); ctx.fillRect(10,-56,4,28);
        // 红色战袍上身
        ctx.fillStyle = this.berserkTimer>0 ? '#ff6600' : '#c8281e'; ctx.fillRect(-12,-56,24,12);

        // arms
        ctx.fillStyle='#f2c14e'; ctx.fillRect(-22,-62,13,11); ctx.fillRect(9,-62,13,11);

        // face
        ctx.fillStyle='#e8a95a'; ctx.beginPath(); ctx.arc(0,-68,13,0,Math.PI*2); ctx.fill();
        // 金箍 headband
        ctx.fillStyle='#ffd700'; ctx.fillRect(-13,-77,26,5);
        ctx.fillStyle='#8a2be2'; ctx.beginPath(); ctx.arc(0,-79,3,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#3a2210'; ctx.fillRect(-13,-82,26,6);
        ctx.fillStyle='#111'; ctx.fillRect(-9,-71,5,4); ctx.fillRect(4,-71,5,4);
        ctx.fillStyle='#fff'; ctx.fillRect(-8,-72,2,2); ctx.fillRect(5,-72,2,2);

        // 攻击距离指示：挥棒扫过的弧光轨迹，直观体现攻击范围（约与 hitBox 的75px同宽）
        if (this.state==='attack') {
            const ph = 1 - this.atkTimer/this.atkDur; // 0 -> 1 over the swing
            const arcAlpha = Math.sin(Math.min(1,ph)*Math.PI); // ramps up then fades
            if (arcAlpha > 0.02) {
                ctx.save();
                ctx.globalAlpha = arcAlpha*0.9;
                ctx.strokeStyle = this.berserkTimer>0 ? '#ffaa44' : '#fff4c0';
                ctx.lineWidth = 7;
                ctx.lineCap = 'round';
                ctx.shadowColor = this.berserkTimer>0 ? '#ff6600' : '#ffd700'; ctx.shadowBlur = 14;
                ctx.beginPath();
                ctx.arc(10, -46, 70, -1.0, 1.3, false);
                ctx.stroke();
                ctx.restore();
            }
        }

        // 金箍棒 (golden cudgel)
        const inAtk = this.state==='attack'||this.state==='skill';
        const swingDur = this.state==='skill' ? 25 : this.atkDur;
        ctx.save(); ctx.translate(14,-48);
        if (inAtk) {
            // 抡起(慢) -> 前挥至接近水平，贴合75px攻击距离(快) -> 收势(慢)，符合"预备-出手-收招"的打击节奏
            ctx.rotate(attackSwingAngle(1 - this.atkTimer/swingDur));
            ctx.shadowColor = this.berserkTimer>0 ? '#ff6600' : '#ffd700'; ctx.shadowBlur=18;
        } else { ctx.rotate(0.2); }
        ctx.fillStyle = inAtk ? (this.berserkTimer>0?'#ffaa44':'#ffe488') : '#d4a017';
        ctx.fillRect(-3,-66,9,66); ctx.fillStyle='#fff2b0'; ctx.fillRect(-1,-66,3,66);
        ctx.fillStyle='#a8790a'; ctx.fillRect(-5,-66,13,6); ctx.fillRect(-5,-4,13,6);
        ctx.restore(); ctx.restore();
    }
};

// ---- Enemy (妖怪) ----
class Enemy {
    constructor(x, type='imp') {
        this.type=type; this.x=x; this.y=GY;
        this.dead=false; this.deathTimer=0; this.hitTimer=0; this.atkCD=0; this.walkFrame=0; this.kx=0;
        if (type==='imp') { this.w=38;this.h=42;this.hp=this.maxHp=50+wave*15;this.speed=1.2+wave*0.15;this.dmg=8; }
        else               { this.w=52;this.h=66;this.hp=this.maxHp=130+wave*30;this.speed=0.9+wave*0.1;this.dmg=18; }
    }
    get facing() { return player.x+player.w/2 > this.x+this.w/2 ? 1 : -1; }
    takeDamage(d) {
        this.hp-=d; this.hitTimer=12;
        if (this.hp<=0 && !this.dead) {
            this.dead=true; this.deathTimer=35;
            score += this.type==='bull' ? 300 : 100;
            player.mp = Math.min(player.maxMp, player.mp + (this.type==='bull'?15:8));
        }
    }
    update() {
        if (skillTreeOpen) return;
        if (this.kx) {
            this.x += this.kx;
            this.kx *= 0.82;
            if (Math.abs(this.kx) < 0.4) this.kx = 0;
            this.x = Math.max(-this.w, Math.min(W, this.x));
        }
        if (this.dead) { if(this.deathTimer>0) this.deathTimer--; return; }
        if (this.hitTimer>0) this.hitTimer--;
        if (this.atkCD>0) this.atkCD--;
        const dx=(player.x+player.w/2)-(this.x+this.w/2), dist=Math.abs(dx);
        const range=this.type==='bull'?62:48;
        if (dist>range) { this.x+=Math.sign(dx)*this.speed; this.walkFrame++; }
        else if (this.atkCD<=0) { player.takeDamage(this.dmg, this.x+this.w/2); this.atkCD=90; }
        this.x=Math.max(-this.w,Math.min(W,this.x));
    }
    draw() {
        if (this.dead&&this.deathTimer<=0) return;
        ctx.save();
        ctx.globalAlpha = this.dead ? this.deathTimer/35 : 1;
        if (this.hitTimer>0) ctx.filter='brightness(2.5) saturate(0)';
        ctx.translate(this.x+this.w/2, this.y); ctx.scale(this.facing,1);
        if (this.type==='imp') {
            // 小妖：紫皮小鬼，头顶两只犄角
            const bob=Math.sin(Date.now()*0.004)*3;
            ctx.fillStyle='rgba(0,0,0,0.28)'; ctx.beginPath(); ctx.ellipse(0,2,18,5,0,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#7a3fbf'; ctx.beginPath(); ctx.ellipse(0,-20+bob,20,22,0,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#9a63d8'; ctx.beginPath(); ctx.ellipse(-5,-30+bob,9,7,-0.3,0,Math.PI*2); ctx.fill();
            // horns
            ctx.fillStyle='#e0d0a0';
            ctx.beginPath(); ctx.moveTo(-10,-38+bob); ctx.lineTo(-14,-50+bob); ctx.lineTo(-4,-40+bob); ctx.closePath(); ctx.fill();
            ctx.beginPath(); ctx.moveTo(10,-38+bob); ctx.lineTo(14,-50+bob); ctx.lineTo(4,-40+bob); ctx.closePath(); ctx.fill();
            ctx.filter='none';
            ctx.fillStyle='#ff2200'; ctx.beginPath(); ctx.arc(7,-22+bob,4,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(-7,-22+bob,4,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(8,-23+bob,1.5,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(-6,-23+bob,1.5,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#3a1a5a'; ctx.fillRect(-6,-12+bob,5,4); ctx.fillRect(1,-12+bob,5,4);
        } else {
            // 牛精：牛头怪，双角，粗壮身躯
            const ls=Math.sin(this.walkFrame*0.2)*6;
            ctx.fillStyle='rgba(0,0,0,0.28)'; ctx.beginPath(); ctx.ellipse(0,2,22,6,0,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#4a3520';
            ctx.save(); ctx.translate(-10,-30); ctx.rotate(ls*0.025);  ctx.fillRect(-6,0,12,30); ctx.restore();
            ctx.save(); ctx.translate(10,-30);  ctx.rotate(-ls*0.025); ctx.fillRect(-6,0,12,30); ctx.restore();
            ctx.fillStyle='#5c4426'; ctx.fillRect(-22,-65,44,38);
            ctx.fillStyle='#78563a'; ctx.fillRect(-16,-62,32,14);
            ctx.fillStyle='#7a5a3e'; ctx.beginPath(); ctx.arc(0,-75,22,0,Math.PI*2); ctx.fill();
            // 牛角
            ctx.fillStyle='#e8e0c8';
            ctx.beginPath(); ctx.moveTo(-14,-90); ctx.lineTo(-24,-104); ctx.lineTo(-6,-92); ctx.closePath(); ctx.fill();
            ctx.beginPath(); ctx.moveTo(14,-90);  ctx.lineTo(24,-104);  ctx.lineTo(6,-92);  ctx.closePath(); ctx.fill();
            ctx.filter='none';
            ctx.fillStyle='#ff1100'; ctx.beginPath(); ctx.arc(9,-77,6,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(-9,-77,6,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#ff6600'; ctx.beginPath(); ctx.arc(9,-77,3,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(-9,-77,3,0,Math.PI*2); ctx.fill();
            // 牛鼻环
            ctx.strokeStyle='#ccc'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,-70,4,0,Math.PI*2); ctx.stroke();
            ctx.fillStyle='#3a2a1a'; ctx.fillRect(18,-62,9,50);
        }
        ctx.scale(this.facing,1);
        const bw=this.w+10;
        ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(-bw/2-1,-this.h-17,bw+2,9);
        ctx.fillStyle='#cc0000';         ctx.fillRect(-bw/2,   -this.h-16,bw*(this.hp/this.maxHp),7);
        ctx.strokeStyle='#ff4444'; ctx.lineWidth=1; ctx.strokeRect(-bw/2,-this.h-16,bw,7);
        ctx.restore();
    }
}

// ---- Background (花果山云海) ----
function drawBackground() {
    const flicker=Math.sin(Date.now()*0.0006);
    const bg=ctx.createLinearGradient(0,0,0,GY); bg.addColorStop(0,'#3a7bd5'); bg.addColorStop(1,'#8fd3f4');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,GY);

    // sun
    ctx.fillStyle='rgba(255,220,120,0.85)'; ctx.beginPath(); ctx.arc(680,60,34,0,Math.PI*2); ctx.fill();

    // distant mountains
    ctx.fillStyle='rgba(70,110,90,0.55)';
    ctx.beginPath(); ctx.moveTo(0,GY);
    for (let x=0;x<=W;x+=40) ctx.lineTo(x, GY-40-Math.sin(x*0.02)*18);
    ctx.lineTo(W,GY); ctx.closePath(); ctx.fill();

    ctx.fillStyle='rgba(50,90,70,0.6)';
    ctx.beginPath(); ctx.moveTo(0,GY);
    for (let x=0;x<=W;x+=40) ctx.lineTo(x, GY-70-Math.sin(x*0.025+2)*26);
    ctx.lineTo(W,GY); ctx.closePath(); ctx.fill();

    // clouds
    for (let i=0;i<5;i++){
        const cx = ((i*220 + flicker*140) % (W+200)) - 100;
        const cy = 55 + (i%3)*40;
        ctx.fillStyle='rgba(255,255,255,0.85)';
        ctx.beginPath();
        ctx.ellipse(cx,cy,42,16,0,0,Math.PI*2);
        ctx.ellipse(cx+30,cy+6,30,13,0,0,Math.PI*2);
        ctx.ellipse(cx-28,cy+6,28,12,0,0,Math.PI*2);
        ctx.fill();
    }

    // ground (花果山)
    const gg=ctx.createLinearGradient(0,GY,0,H); gg.addColorStop(0,'#3f8a4a'); gg.addColorStop(1,'#215a2c');
    ctx.fillStyle=gg; ctx.fillRect(0,GY,W,H-GY);
    ctx.fillStyle='#5cae5c'; ctx.fillRect(0,GY,W,4); ctx.fillStyle='#7ecf7e'; ctx.fillRect(0,GY,W,2);
    ctx.strokeStyle='rgba(30,70,40,0.3)'; ctx.lineWidth=1;
    for(let x=0;x<W;x+=80){ctx.beginPath();ctx.moveTo(x,GY+4);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=GY+4;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

    // 桃树 decorations
    for(let i=0;i<3;i++){
        const tx=140+i*260;
        ctx.fillStyle='#5c3a20'; ctx.fillRect(tx-4,GY-38,8,38);
        ctx.fillStyle='#3f8a3f'; ctx.beginPath(); ctx.arc(tx,GY-46,26,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#ff6b81';
        ctx.beginPath(); ctx.arc(tx-10,GY-42,5,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(tx+8,GY-50,5,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(tx+2,GY-32,5,0,Math.PI*2); ctx.fill();
    }
}

// ---- HUD ----
function drawHUD() {
    // HP
    ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(10,10,206,22);
    ctx.fillStyle=player.hp>50?'#dd2222':player.hp>25?'#ff8800':'#ff2200';
    ctx.fillRect(12,12,202*(player.hp/player.maxHp),18);
    ctx.strokeStyle='#ff4444'; ctx.lineWidth=1.5; ctx.strokeRect(10,10,206,22);
    ctx.fillStyle='#fff'; ctx.font='bold 12px sans-serif'; ctx.textAlign='left';
    ctx.fillText(`HP  ${player.hp} / ${player.maxHp}`, 16, 25);
    // MP
    ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(10,36,206,16);
    ctx.fillStyle='#2255dd'; ctx.fillRect(12,38,202*(player.mp/player.maxMp),12);
    ctx.strokeStyle='#4488ff'; ctx.lineWidth=1; ctx.strokeRect(10,36,206,16);
    ctx.fillStyle='#aaccff'; ctx.font='11px sans-serif';
    ctx.fillText(`MP  ${Math.floor(player.mp)} / ${player.maxMp}`, 16, 49);
    // Berserk
    if (player.berserkTimer>0) {
        ctx.fillStyle='#ff6600'; ctx.font='bold 11px sans-serif';
        ctx.fillText(`💪齐天神力 ${Math.ceil(player.berserkTimer/60)}s`, 16, 64);
    }
    // Score
    ctx.fillStyle='#ffdd00'; ctx.font='bold 20px sans-serif'; ctx.textAlign='right';
    ctx.fillText(score.toLocaleString(), W-12, 30);
    ctx.fillStyle='#aaa'; ctx.font='11px sans-serif'; ctx.fillText('SCORE', W-12, 44);
    // Wave
    ctx.fillStyle='#ff8800'; ctx.font='bold 15px sans-serif'; ctx.textAlign='center';
    ctx.fillText(`第 ${wave} 关`, W/2, 25);
    ctx.fillStyle='#333'; ctx.font='12px sans-serif';
    ctx.fillText(`残存妖怪: ${enemies.filter(e=>!e.dead).length}`, W/2, 42);
    // Combo
    if (player.combo>1 && player.comboTimer>0) {
        const ca=Math.min(1,player.comboTimer/30);
        ctx.save(); ctx.globalAlpha=ca;
        ctx.fillStyle=`hsl(${40+player.combo*4},100%,58%)`;
        ctx.font=`bold ${Math.min(28,14+player.combo*2)}px sans-serif`; ctx.textAlign='center';
        ctx.strokeStyle='#000'; ctx.lineWidth=3;
        ctx.strokeText(`${player.combo} COMBO!`,W/2,66); ctx.fillText(`${player.combo} COMBO!`,W/2,66);
        ctx.restore();
    }
    // Skill slots (bottom)
    const sw=52, sh=52, sg=6;
    SLOT_LABELS.forEach((lbl,i) => {
        const sx=10+i*(sw+sg), sy=H-sh-10;
        const sk = getSkill(equippedSkills[i]);
        ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.fillRect(sx,sy,sw,sh);
        ctx.strokeStyle=sk?sk.color:'#334466'; ctx.lineWidth=1.5; ctx.strokeRect(sx,sy,sw,sh);
        ctx.fillStyle='#fff'; ctx.font='bold 9px sans-serif'; ctx.textAlign='left'; ctx.fillText(lbl,sx+3,sy+11);
        if (sk) {
            ctx.font='18px sans-serif'; ctx.textAlign='center'; ctx.fillText(sk.icon,sx+sw/2,sy+34);
            ctx.fillStyle=sk.color; ctx.font='bold 8px sans-serif'; ctx.fillText(sk.name,sx+sw/2,sy+46);
            if (slotCDs[i]>0) {
                ctx.fillStyle='rgba(0,0,0,0.62)'; ctx.fillRect(sx,sy,sw,sh*(slotCDs[i]/sk.maxCd));
                ctx.fillStyle='#ffdd00'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center';
                ctx.fillText(Math.ceil(slotCDs[i]/60)+'s', sx+sw/2, sy+sh-10);
            } else if (player.mp<sk.mpCost) {
                ctx.fillStyle='rgba(0,0,60,0.55)'; ctx.fillRect(sx,sy,sw,sh);
                ctx.fillStyle='#88aaff'; ctx.font='8px sans-serif'; ctx.textAlign='center'; ctx.fillText('MP不足',sx+sw/2,sy+sh-10);
            }
        } else {
            ctx.fillStyle='#334466'; ctx.font='11px sans-serif'; ctx.textAlign='center'; ctx.fillText('空',sx+sw/2,sy+sh/2+4);
        }
    });
    // hint
    ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.font='11px sans-serif'; ctx.textAlign='right';
    ctx.fillText('Tab 神通谱  AD移动  K跳跃  J攻击  UIOL神通', W-10, H-10);
    // skill tree indicator
    if (skillTreeOpen) {
        ctx.fillStyle='rgba(255,210,90,0.9)'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center';
        ctx.fillText('【神通谱已打开 — Tab关闭】', W/2, H-28);
    }
}

// ---- Wave ----
function spawnWave() {
    const total=3+wave*2, bullChance=Math.min(0.5,0.1+wave*0.08);
    for(let i=0;i<total;i++){
        setTimeout(()=>{
            if(gameState!=='play') return;
            const side=Math.random()<0.5?-45:W+5;
            enemies.push(new Enemy(side, Math.random()<bullChance?'bull':'imp'));
        }, i*700);
    }
}
function checkWaveEnd() {
    if (!enemies.length) return;
    if (!enemies.some(e=>!e.dead) && !enemies.some(e=>e.dead&&e.deathTimer>0)) {
        enemies=[]; wave++;
        if (wave > maxWave) maxWave = wave;
        setTimeout(spawnWave, 1500);
    }
}

// ---- Game Over ----
function drawGameOver() {
    ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.fillRect(0,0,W,H);
    ctx.save(); ctx.textAlign='center';
    ctx.fillStyle='#ff2200'; ctx.font='bold 52px sans-serif';
    ctx.strokeStyle='#000'; ctx.lineWidth=4;
    ctx.strokeText('闯关失败',W/2,H/2-50); ctx.fillText('闯关失败',W/2,H/2-50);
    ctx.fillStyle='#ffdd00'; ctx.font='bold 26px sans-serif';
    ctx.fillText(`最终得分: ${score.toLocaleString()}`, W/2, H/2+5);
    ctx.fillStyle='#ff8800'; ctx.font='18px sans-serif';
    ctx.fillText(`到达第 ${wave} 关`, W/2, H/2+38);
    ctx.fillStyle='#fff'; ctx.font='16px sans-serif';
    ctx.fillText('按  R  重新开始', W/2, H/2+72);
    ctx.restore();
    if (keys['KeyR']) { keys['KeyR']=false; resetGame(); }
}

function resetGame() {
    score=0; wave=1; gameState='play'; enemies=[]; projectiles=[]; effects.length=0;
    slotCDs=[0,0,0,0];
    Object.assign(player, {x:100,y:GY,vx:0,vy:0,hp:100,mp:100,
        state:'idle',atkCD:0,invTimer:0,combo:0,comboTimer:0,berserkTimer:0});
    spawnWave();
}

// ---- Main Loop ----
function loop() {
    ctx.clearRect(0,0,W,H);

    if (gameState==='play' && !skillTreeOpen) {
        if (hitStop > 0) {
            // hit-stop: freeze gameplay logic for a couple frames right when a hit lands, for punch weight
            hitStop--;
        } else {
            player.update();
            enemies.forEach(e=>e.update());
            enemies=enemies.filter(e=>!e.dead||e.deathTimer>0);
            projectiles.forEach(p=>p.update());
            projectiles=projectiles.filter(p=>!p.dead);
            checkWaveEnd();
        }
        updateEffects();
    }

    let shakeX = 0, shakeY = 0;
    if (shakeTimer > 0) {
        shakeX = rand(-shakeMag, shakeMag);
        shakeY = rand(-shakeMag, shakeMag);
        shakeTimer--;
        if (shakeTimer <= 0) shakeMag = 0;
    }

    ctx.save();
    ctx.translate(shakeX, shakeY);
    drawBackground();
    projectiles.forEach(p=>p.draw());
    enemies.forEach(e=>e.draw());
    player.draw();
    drawEffects();
    drawHUD();
    if (gameState==='over') drawGameOver();
    drawSkillTree();
    ctx.restore();

    requestAnimationFrame(loop);
}

spawnWave();
loop();
</script>
